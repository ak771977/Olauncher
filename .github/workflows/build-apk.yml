name: Build APK

on:
  push:
    branches:
      - claude/customize-launcher-clock-011CUq3qvWcNYgiV3XQofcAd
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info --no-daemon

    - name: Upload APK as Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: olauncher-custom-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Get commit info
      if: success()
      id: commit
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

    - name: Create/Update Latest Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Build (Auto-Updated)"
        body: |
          ## 🚀 Custom Olauncher - Latest Build

          **Build Date:** ${{ steps.commit.outputs.date }}
          **Commit:** ${{ steps.commit.outputs.sha_short }}

          ### Features Included:
          - ⏰ Dual Timezone Clock (Local | NY time)
          - 📱 Default Android App Drawer Option
          - 🎯 Zero to 8 Home Apps Support
          - 👆 All Swipe Gestures Functional

          ### Installation:
          1. Download `app-debug.apk` below
          2. Transfer to your Android device
          3. Install (enable "Unknown Sources" if needed)
          4. Set as default launcher
          5. Long press home → Settings → Enable features

          This release is automatically updated on every commit.
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
